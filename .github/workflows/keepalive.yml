# Respaldo del cron de Vercel: mantiene activo el proyecto de Supabase
# llamando a la función keepalive() de la base de datos.
# La clave publishable es pública por diseño (es la misma de config-nube.js).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 */12 * * *'   # cada 12 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a keepalive()
        env:
          SUPABASE_URL: https://pmlmdavfhihdgnbiyuyg.supabase.co
          SUPABASE_KEY: sb_publishable_CUX1s9876tulegCLFkY-TA_Fyj7yIMi
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"origen":"github-actions"}'
